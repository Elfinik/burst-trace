name: 🐛 Bug Report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for deciding to report a bug. Please fill out the form below.
  - type: input
    id: unity-version
    attributes:
      label: Unity Version
      placeholder: e.g., 2022.3.15f1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      description: What platform were you building for or running on?
      options:
        - Editor (Windows/Mac/Linux)
        - Android
        - iOS
        - WebGL
        - Console (PS/Xbox/Switch)
        - Standalone Build
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Stacktrace
      description: Please paste relevant logs from the Unity Console here.
      render: shell